<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d0912" />
    <meta name="robots" content="noindex" />
    <title>Not found — EDH Seer</title>
    <!-- THIS FILE IS WHY A MISSING ASSET CAN 404. Without it Cloudflare Pages answers every
         unmatched path with `index.html` at status 200 -- including `/assets/main-<hash>.js` during
         the seconds of a deploy, which is how a browser came to cache an HTML response under a
         JavaScript URL behind `immutable, max-age=31536000` and could not start the app for a year.
         The client-side routes that legitimately have no file are handed the shell by
         `functions/[[path]].ts`; everything else lands here.
         Plain CSS on the same tokens as `index.html`'s static sections, for the same reason: this
         page must render with no bundle, and Tailwind does not scan it. It is a file rather than a
         `<style>` element because the CSP is `style-src 'self'`, and it is linked from the root
         because this page answers missing paths at any depth. -->
    <link rel="stylesheet" href="/404.css" />
  </head>
  <body>
    <main>
      <h1>Nothing here</h1>
      <p>
        We couldn&rsquo;t find that page. If it was a card link, that card may not have a page: we
        only make them for cards whose text we can read.
      </p>
      <p>
        <a href="/">Analyse a deck</a> · <a href="/cards">Search the cards</a> ·
        <a href="/how-it-works">How it works</a>
      </p>
    </main>
  </body>
</html>
