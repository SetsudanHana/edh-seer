name = "edhseer-import"
main = "src/index.ts"
compatibility_date = "2026-09-03"

# Same origin as the site, so the client fetches a relative path and there is no CORS to configure
# and nothing to allowlist.
routes = [{ pattern = "edhseer.cards/api/import/*", zone_name = "edhseer.cards" }]

# THIS TABLE STAYS BELOW EVERY TOP-LEVEL KEY. A TOML table header swallows every key that follows it,
# so writing this block above `routes` put the route INSIDE `[observability]` -- wrangler said
# "Unexpected fields found in observability field: routes" and parsed the route away. Any new
# top-level key goes above here, not below.
#
# WORKERS LOGS, AT 100%. The dashboard already draws requests, errors and CPU without asking; what it
# cannot tell you is WHY an import failed, and this worker's failure modes are all indistinguishable
# from the outside -- a 502 is "the deck site is down", "the deck site changed its JSON under us" or
# "our breaker is open", and the pacer's own comment on the shape-changed branch says the message is
# "worth seeing in the logs" while nothing emitted one.
#
# 100% SAMPLING BECAUSE THE VOLUME IS TINY. This worker is one request per deck import, throttled to
# 20 a minute per IP and one a second upstream, so there is no rate at which sampling saves anything
# a reader would miss. Lower `head_sampling_rate` only if the daily log quota ever binds.
#
# Query strings are not redacted because there are none: the deck id travels in the PATH
# (`/api/import/<source>/<id>`), which is a public identifier on both sites.
[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "PACER"
class_name = "Pacer"

# SQLITE-BACKED, because that is the only Durable Object class available on the Workers Free plan.
# The Pacer stores nothing; the migration exists to satisfy the platform, not to keep state.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pacer"]

# MOXFIELD_UA is a SECRET and is deliberately absent from this file.
#   npx wrangler secret put MOXFIELD_UA

# PER-IP THROTTLE, because the WAF's rate limiting rules are not on this plan. Per-Cloudflare-location
# rather than global, which is the right amount of accuracy for what this defends: NOT the deck sites
# -- the pacer already makes exceeding one request a second impossible at any inbound rate -- but our
# own queue, and the Durable Object's daily request budget. A script that eats those denies the
# feature to real readers.
#
# 20 a minute is generous for a person importing several decks and hostile to a loop. The period may
# only be 10 or 60.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 20
period = 60
