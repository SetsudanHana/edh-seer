name: A synergy claim is wrong
description: The site paired two cards that should not be paired, or missed a pairing it should have found.
title: "[edge] "
labels: ["edge", "correctness"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful report this project receives.

        Every pairing the site shows is a printed sentence naming both cards and why they pair, which
        means it can be checked against the cards and disagreed with. A wrong one is a defect with a
        witness already attached.

  - type: dropdown
    id: direction
    attributes:
      label: Which way is it wrong?
      options:
        - The claim is FALSE — these two cards do not work together like that
        - The claim is MISSING — these two cards clearly work together and were not paired
    validations:
      required: true

  - type: input
    id: producer
    attributes:
      label: First card
      description: Exactly as printed. If the claim has a direction, this is the card that causes the event; the second card cares about it.
      placeholder: Siege-Gang Commander
    validations:
      required: true

  - type: input
    id: consumer
    attributes:
      label: Second card
      placeholder: Skullclamp
    validations:
      required: true

  - type: textarea
    id: sentence
    attributes:
      label: The sentence the site printed
      description: Copy it verbatim if the claim exists. Leave blank for a missing pairing.
      placeholder: When Siege-Gang Commander dies, Skullclamp draws you 2 cards
    validations:
      required: false

  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: |
        The rules reason, in your own words. "The trigger only counts creatures you control and this
        one is on the opponent's side" is exactly the right level of detail.

        Some misses are known limits rather than bugs. A tutor or recursion spell that names only "a
        card" or "a creature card" pairs with nothing, by design; one that names a kind of card (a
        Goblin, an artifact) does pair. See "Honest limitations" in the README.
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Link to the page, if you have one
      placeholder: https://edhseer.cards/cards/siege-gang-commander
    validations:
      required: false
