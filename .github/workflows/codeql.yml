name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory is found without waiting for the next commit.
    - cron: "27 4 * * 1"

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans these workflow files. It ran before without being listed, because the
        # init step's input was misspelled `language:` and CodeQL fell back to auto-detecting every
        # language in the repository -- which also found Python, and failed once the last .py went.
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Nothing here pushes, so the token is not left in .git/config for later steps.
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # security-and-quality also reports maintainability findings; this repo wants the
          # security signal to stay readable, so it runs the extended SECURITY pack only.
          queries: security-extended
          # `paths-ignore: research` lives in the config rather than here, because the workflow
          # input has no equivalent. See that file for why the exclusion is drawn where it is.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
