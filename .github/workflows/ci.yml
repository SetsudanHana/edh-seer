name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is current LTS.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # BEFORE the suite, because a green suite is NOT a compiling one -- `vitest` transpiles per
      # file and never typechecks, so the matcher once carried two type errors 2,706 passing tests
      # could not see. Run on both legs even though tsc is Node-agnostic: it is one line and it
      # keeps the two required status checks the only ones branch protection has to know about.
      - run: npm run typecheck
      # The suite is pure: no MongoDB, no network, no API key. Anything needing a live corpus lives
      # in a bin rather than a test, and the one test backed by a gitignored cache skips itself with
      # a reason instead of failing a clean checkout.
      - run: npm test
      # The design system in tokens/ is EXTRACTED from the shipped packages/web/client/src/index.css,
      # so it can drift from what actually renders. Three gates, all python3 stdlib (no pip step):
      #   validate_tokens   - every tokens/*.json parses as DTCG and every alias resolves
      #   validate_contrast - the required WCAG 2.2 pairs still pass on the real hex values
      #   validate_theme_refs - no component reaches for a var() no token defines (a "floating token",
      #                         the defect css-tokens.test.ts was written for)
      # Inside the existing job, not a new one: `test (node 20|22)` are the only two checks branch
      # protection knows about, and a separate job would gate nothing until someone adds it there.
      - run: npm run tokens:check
      # tokens/theme.css is GENERATED. Editing tokens/*.json without rebuilding it is the drift the
      # gates above cannot see, because they would both read the same stale pair.
      - run: npm run tokens:build && git diff --exit-code -- tokens/theme.css
